<!doctype html><meta charset="utf-8"><title>QA móvil · TU CONTROLAS</title><style>body{font:14px system-ui;background:#edf1f5}iframe{width:390px;height:844px;border:1px solid #8190a0;background:white}button{padding:12px;margin:8px}#result{white-space:pre-wrap}</style><h1>Revisión móvil a 390 × 844</h1><p>Viewport móvil para comprobar diseño. No equivale a un dispositivo Android físico.</p><button id="test">Probar selección, arrastre y pellizco</button><pre id="result"></pre><iframe title="TU CONTROLAS móvil" src="/"></iframe>
<script>
document.getElementById('test').onclick=async()=>{const out=document.getElementById('result'),win=document.querySelector('iframe').contentWindow,doc=win.document,pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,msg)=>{if(!ok)throw Error(msg)},before=JSON.stringify(win.gRows()),revision=win.qaState().revision,checks=[];let restore;
try{out.textContent='Ejecutando prueba…';doc.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));const board=doc.getElementById('gBoard');board.scrollTop=0;assert(board,'Falta cronograma');const first=doc.querySelector('.g-grid-row:nth-child(3) .g-name')||doc.querySelectorAll('.g-grid-row .g-name')[1],point=first.getBoundingClientRect();const event=(target,type,x,y)=>target.dispatchEvent(new win.PointerEvent(type,{bubbles:true,pointerId:999,pointerType:'touch',button:0,clientX:x,clientY:y}));event(first,'pointerdown',point.x+10,point.y+10);await pause(560);event(first,'pointerup',point.x+10,point.y+10);assert(doc.querySelector('.is-delete-selected'),'La pulsación larga no seleccionó');assert(JSON.stringify(win.gRows())===before,'Seleccionar cambió datos');checks.push('Selección larga: sin escritura ni movimiento');doc.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));assert(!doc.querySelector('.is-delete-selected'),'Escape no canceló');checks.push('Escape cancela selección');
const width=win.qaState().zoom,touch=(type,a,b)=>{const ev=new win.Event(type,{bubbles:true,cancelable:true});Object.defineProperty(ev,'touches',{value:b==null?[]:[{clientX:50,clientY:a},{clientX:50,clientY:b}]});board.dispatchEvent(ev)};touch('touchstart',100,200);touch('touchmove',100,300);touch('touchend');assert(win.qaState().zoom===Math.min(4,width*2),'No se aplicó pellizco');assert(JSON.stringify(win.gRows())===before,'El pellizco cambió datos');checks.push('Pellizco: cambia escala, conserva fechas y datos');
const scroll=doc.getElementById('gBoard');scroll.scrollTop=scroll.scrollHeight;const handles=[...doc.querySelectorAll('.g-grid-row .g-drag-handle')],handle=handles.at(-1),id=handle.closest('.g-grid-row').dataset.row,rect=handle.getBoundingClientRect(),capture=handle.setPointerCapture;restore=()=>handle.setPointerCapture=capture;handle.setPointerCapture=()=>{};event(handle,'pointerdown',rect.x+5,rect.y+5);const qaPointerY=scroll.getBoundingClientRect().top+4;event(handle,'pointermove',rect.x+5,qaPointerY);const deadline=Date.now()+12000;while(scroll.scrollTop>0&&Date.now()<deadline)await pause(100);assert(scroll.scrollTop===0,'El desplazamiento automático no llegó al inicio: '+JSON.stringify({scrollTop:scroll.scrollTop,boardTop:scroll.getBoundingClientRect().top,pointerY:qaPointerY}));event(handle,'pointermove',rect.x+5,scroll.getBoundingClientRect().top+42);event(handle,'pointerup',rect.x+5,scroll.getBoundingClientRect().top+42);await pause(2000);assert(win.gRows()[1].id===id,'No llegó desde última a primera actividad');const sent=win.gRows().map(p=>[p.id,p.parent_id,p.start,p.end,p.depends_on,p.observations,p.budget,p.economic_observations]).sort(),old=JSON.parse(before).map(p=>[p.id,p.parent_id,p.start,p.end,p.depends_on,p.observations,p.budget,p.economic_observations]).sort();assert(JSON.stringify(sent)===JSON.stringify(old),'El arrastre alteró planificación');assert(win.qaState().revision===revision+1,'No se verificó el guardado del arrastre');checks.push('Última → primera: guardado en PostgreSQL, jerarquía, fechas y mediciones conservadas');out.textContent='PASS\n'+checks.join('\n');}catch(e){out.textContent='FAIL: '+e.message+'\n'+checks.join('\n')}finally{restore?.();doc.getElementById('gBoard')?.dispatchEvent(new win.PointerEvent('pointercancel',{bubbles:true,pointerId:999,pointerType:'touch'}))}};
</script>
